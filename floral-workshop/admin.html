<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة التسجيل والحضور | ENSI Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FBF3B5;
            --dark-olive: #1a241c;
            --glass-bg: rgba(20, 30, 20, 0.7);
            --glass-border: rgba(251, 243, 181, 0.2);
            --green: #4CAF50;
            --orange: #FF9800;
            --gray: #9E9E9E;
            --red: #F44336;
            --blue: #2196F3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        
        body {
            background-color: var(--dark-olive);
            color: #dcdcdc;
            min-height: 100vh;
            padding: 20px;
            background-image: linear-gradient(-45deg, #1b271d, #261618);
        }

        .admin-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* تنسيق الهيدر والشعار بالمنتصف */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 25px;
            margin-bottom: 25px;
            gap: 10px;
            text-align: center;
        }

        .cobranding img { height: 80px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
        .header-title { color: var(--gold); font-size: 22px; font-weight: 700; letter-spacing: 1px; }

        /* شبكة الإحصائيات (مربعات بدلاً من مستطيلات) */
        .stats-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        
        .stats-row-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .stats-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }

        .stat-card {
            background: rgba(251, 243, 181, 0.05);
            border: 1px solid rgba(251, 243, 181, 0.15);
            border-radius: 16px;
            padding: 30px 10px; 
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s;
        }

        .stat-card:hover { transform: translateY(-3px); }
        .stat-card.green-box { border-color: rgba(76, 175, 80, 0.4); background: rgba(76, 175, 80, 0.05); }
        .stat-card.red-box { border-color: rgba(244, 67, 54, 0.4); background: rgba(244, 67, 54, 0.05); }

        .stat-value { font-size: 28px; font-weight: 800; color: var(--gold); margin-bottom: 8px; }
        .stat-card.green-box .stat-value { color: var(--green); }
        .stat-card.red-box .stat-value { color: var(--red); }
        
        .stat-label { font-size: 13px; color: #a0a0a0; font-weight: 500; line-height: 1.4; }

        /* شريط التنبيه للكاش */
        .cash-alert {
            background: rgba(244, 67, 54, 0.1);
            border: 1px dashed var(--red);
            color: var(--red);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 30px;
            display: none;
        }

        /* التبويبات Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.3);
            padding: 6px;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: #a0a0a0;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        .tab-btn.active { background: var(--gold); color: var(--dark-olive); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* القوائم */
        .registrations-list {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(251, 243, 181, 0.05);
            transition: background 0.3s;
        }

        .list-item:hover { background: rgba(251, 243, 181, 0.05); }
        .list-item:last-child { border-bottom: none; }

        .item-name { color: #fff; font-weight: 700; font-size: 16px; margin-bottom: 5px; }
        .item-phone { color: #a0a0a0; font-size: 14px; direction: ltr; display: inline-block; }
        .item-details { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
        
        .badges-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end;}

        .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            text-align: center;
        }

        .badge.green { background: rgba(76, 175, 80, 0.15); color: var(--green); border: 1px solid rgba(76, 175, 80, 0.3); }
        .badge.orange { background: rgba(255, 152, 0, 0.15); color: var(--orange); border: 1px solid rgba(255, 152, 0, 0.3); }
        .badge.gray { background: rgba(158, 158, 158, 0.15); color: var(--gray); border: 1px solid rgba(158, 158, 158, 0.3); }
        .badge.gold { background: rgba(251, 243, 181, 0.15); color: var(--gold); border: 1px solid rgba(251, 243, 181, 0.3); }
        .badge.cash { background: rgba(244, 67, 54, 0.15); color: var(--red); border: 1px solid rgba(244, 67, 54, 0.3); }
        .badge.bank { background: rgba(76, 175, 80, 0.1); color: #8bc34a; border: 1px solid rgba(139, 195, 74, 0.3); }
        /* شارة تم الحضور الزرقاء (بدون إيموجي) */
        .badge.blue { background: rgba(33, 150, 243, 0.15); color: var(--blue); border: 1px solid rgba(33, 150, 243, 0.4); }

        .loading-msg { text-align: center; color: var(--gold); font-size: 16px; font-weight: 700; padding: 40px; }

        @media (max-width: 600px) {
            .stats-row-3 { grid-template-columns: 1fr; }
            .list-item { flex-direction: column; align-items: flex-start; gap: 15px; }
            .item-details { align-items: flex-start; width: 100%; }
            .badges-row { justify-content: flex-start; }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        
        <div class="header">
            <div class="cobranding">
                <img src="https://raw.githubusercontent.com/EnsiEvents/Ensi-Events/4819495e2ec21a6a5eae64ffcf60d1d8bb67049c/ENSI%20Logo.svg" alt="ENSI Events">
            </div>
            <div class="header-title">إدارة التسجيل والحضور</div>
        </div>

        <div id="loader" class="loading-msg">جاري مزامنة البيانات من قاعدة البيانات... ⏳</div>

        <div id="dashboard" style="display: none;">
            
            <div class="stats-container">
                <!-- الصف الأول: الأعداد -->
                <div class="stats-row-2">
                    <div class="stat-card">
                        <div class="stat-value" id="valTotal">0</div>
                        <div class="stat-label">إجمالي المسجلين<br>(الكل)</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="valConfirmed">0</div>
                        <div class="stat-label">المثبتين<br>(الحضور المؤكد)</div>
                    </div>
                </div>

                <!-- الصف الثاني: الماليّات -->
                <div class="stats-row-3">
                    <div class="stat-card">
                        <div class="stat-value" id="valExpectedRev">0 ₺</div>
                        <div class="stat-label">الإيرادات المتوقعة<br>(للمؤكدين)</div>
                    </div>
                    <div class="stat-card green-box">
                        <div class="stat-value" id="valReceivedRev">0 ₺</div>
                        <div class="stat-label">الإيرادات المستلمة<br>(حوالة + استلام)</div>
                    </div>
                    <div class="stat-card red-box">
                        <div class="stat-value" id="valUnreceivedRev">0 ₺</div>
                        <div class="stat-label">الإيرادات الغير مستلمة<br>(كاش قيد الانتظار)</div>
                    </div>
                </div>
            </div>

            <!-- شريط تنبيه الكاش -->
            <div class="cash-alert" id="cashAlertBox">
                ⚠️ تنبيه: <span id="cashCountNumber">0</span> مشتركات سيقومون بالدفع كاش يوم الورشة
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('tab-main')">التسجيلات العامة</button>
                <button class="tab-btn" onclick="switchTab('tab-attendance')">سجل الحضور والاستلام</button>
            </div>

            <!-- التبويبة الأولى: الكل -->
            <div id="tab-main" class="tab-content active">
                <div class="registrations-list" id="listMain"></div>
            </div>

            <!-- التبويبة الثانية: الحضور -->
            <div id="tab-attendance" class="tab-content">
                <div class="registrations-list" id="listAttendance"></div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyuzaPFLpqKjJGyXKy0itQ7dCKgMDGYrhd5nnQjB20FD5XigVS7_TpjjzzE_YO2RVf-/exec';

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        fetch(scriptURL)
            .then(res => res.json())
            .then(data => {
                let mainData = data.mainData;
                let attendanceData = data.attendanceData;

                // إزالة صف العناوين للحسابات
                if (mainData.length > 0) mainData.shift();
                if (attendanceData.length > 0) attendanceData.shift();

                let totalRegistered = 0;
                let confirmedCount = 0;
                let expectedRevenue = 0;
                let receivedRevenue = 0;
                let unreceivedRevenue = 0;
                let pendingCashCount = 0;

                // 1. بناء قائمة التسجيلات العامة
                let mainHtml = '';
                mainData.forEach(row => {
                    if (row[1] && row[1] !== "") {
                        totalRegistered++;
                        let status = row[5] || 'قيد الانتظار';
                        let colorClass = 'gray';
                        if (status === 'تم التأكيد') colorClass = 'green';
                        else if (status === 'تم التواصل') colorClass = 'orange';

                        mainHtml += `
                            <div class="list-item">
                                <div>
                                    <div class="item-name">${row[1]} ${row[2] || ''}</div>
                                    <div class="item-phone">${row[3]}</div>
                                </div>
                                <div><span class="badge ${colorClass}">${status}</span></div>
                            </div>
                        `;
                    }
                });

                // 2. بناء قائمة سجل الحضور (بالمؤشرات الدقيقة وتنظيف الأرقام)
                let attHtml = '';
                attendanceData.forEach(row => {
                    // المصفوفة من دالة السحب QUERY:
                    // 0=الاسم, 1=العائلة, 2=الواتساب, 3=المبلغ, 4=طريقة الدفع, 5=حالة الاستلام, 6=تأكيد الحضور (Checkbox)
                    if (row[0] && row[0] !== "") {
                        confirmedCount++;
                        
                        // تنظيف النص واستخراج الرقم الصافي فقط لحل مشكلة (0)
                        let rawAmount = String(row[3] || '0');
                        let cleanAmount = rawAmount.replace(/[^\d]/g, ''); 
                        let amount = parseInt(cleanAmount, 10) || 0;
                        
                        let method = row[4] || 'غير محدد';
                        let payStatus = row[5] || 'قيد الانتظار';
                        
                        // قراءة حالة الحضور (إذا كان المربع مؤشر TRUE)
                        let isAttended = (row[6] === true || row[6] === 'TRUE' || row[6] === 'true');
                        
                        expectedRevenue += amount;
                        
                        // المعادلة المالية: يعتبر مستلم إذا كان حوالة أو إذا تم استلام الكاش
                        let isReceived = (payStatus === 'تم الاستلام' || method === 'حوالة بنكية');
                        
                        if (isReceived) {
                            receivedRevenue += amount;
                        } else {
                            unreceivedRevenue += amount;
                            // إذا لم يُستلم وهو كاش، أضفه لتنبيه الكاش
                            if (method === 'كاش يوم الورشة') pendingCashCount++;
                        }

                        // تحديد ألوان الشارات
                        let methodClass = (method === 'حوالة بنكية') ? 'bank' : 'cash';
                        let statusClass = (payStatus === 'تم الاستلام') ? 'green' : 'gray';

                        // شارة الحضور بدون إيموجي
                        let attendanceBadge = isAttended ? `<span class="badge blue">تم الحضور</span>` : '';

                        attHtml += `
                            <div class="list-item">
                                <div>
                                    <div class="item-name">${row[0]} ${row[1] || ''}</div>
                                    <div class="item-phone">${row[2]}</div>
                                </div>
                                <div class="item-details">
                                    <span class="badge gold">${amount} ₺</span>
                                    <div class="badges-row">
                                        <span class="badge ${methodClass}">${method}</span>
                                        <span class="badge ${statusClass}">${payStatus}</span>
                                        ${attendanceBadge}
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                });

                // تحديث الأرقام في الداشبورد
                document.getElementById('valTotal').innerText = totalRegistered;
                document.getElementById('valConfirmed').innerText = confirmedCount;
                document.getElementById('valExpectedRev').innerText = expectedRevenue + ' ₺';
                document.getElementById('valReceivedRev').innerText = receivedRevenue + ' ₺';
                document.getElementById('valUnreceivedRev').innerText = unreceivedRevenue + ' ₺';
                
                // تنبيه الكاش
                if(pendingCashCount > 0) {
                    document.getElementById('cashCountNumber').innerText = pendingCashCount;
                    document.getElementById('cashAlertBox').style.display = 'block';
                }

                document.getElementById('listMain').innerHTML = mainHtml || '<div style="padding:20px;text-align:center">لا توجد تسجيلات بعد</div>';
                document.getElementById('listAttendance').innerHTML = attHtml || '<div style="padding:20px;text-align:center">لا يوجد حضور مؤكد بعد</div>';

                document.getElementById('loader').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('loader').innerText = 'حدث خطأ في الاتصال بقاعدة البيانات. يرجى التحديث.';
                document.getElementById('loader').style.color = 'var(--red)';
            });
    </script>
</body>
</html>
