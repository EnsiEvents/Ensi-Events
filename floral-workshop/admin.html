<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - ورشة ورد الخريف</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FBF3B5;
            --dark-olive: #1a241c;
            --glass-bg: rgba(20, 30, 20, 0.6);
            --glass-border: rgba(251, 243, 181, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        
        body {
            background-color: var(--dark-olive);
            color: #dcdcdc;
            min-height: 100vh;
            padding: 20px;
            background-image: linear-gradient(-45deg, #1b271d, #261618);
        }

        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header-title {
            color: var(--gold);
            font-size: 24px;
            font-weight: 700;
        }

        .cobranding {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cobranding img { height: 30px; }
        .cobranding .separator { width: 1px; height: 20px; background-color: var(--glass-border); }
        .cobranding .rosaria-text { font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #fff; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(251, 243, 181, 0.05);
            border: 1px solid rgba(251, 243, 181, 0.15);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #a0a0a0;
        }

        .registrations-list {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
        }

        .list-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(251, 243, 181, 0.1);
            padding: 15px 20px;
            font-weight: 700;
            color: var(--gold);
            border-bottom: 1px solid var(--glass-border);
        }

        .list-item {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(251, 243, 181, 0.05);
            transition: background 0.3s;
        }

        .list-item:hover {
            background: rgba(251, 243, 181, 0.05);
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .item-name { color: #fff; font-weight: 500; }
        .item-phone { color: #a0a0a0; direction: ltr; text-align: right; }

        .action-btn {
            display: block;
            width: 100%;
            background: var(--gold);
            color: var(--dark-olive);
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-top: 30px;
            transition: 0.3s;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(251, 243, 181, 0.3);
        }

        @media (max-width: 600px) {
            .header { flex-direction: column; gap: 15px; align-items: flex-start; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header">
            <div class="header-title">لوحة التحكم التسجيلات</div>
            <div class="cobranding">
                <img src="https://raw.githubusercontent.com/EnsiEvents/Ensi-Events/4819495e2ec21a6a5eae64ffcf60d1d8bb67049c/ENSI%20Logo.svg" alt="ENSI Events">
                <div class="separator"></div>
                <div class="rosaria-text">ROSARIA</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">--</div>
                <div class="stat-label">إجمالي المشتركات</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">-- ليرة</div>
                <div class="stat-label">الإيرادات المتوقعة</div>
            </div>
        </div>

        <div class="registrations-list">
            <div class="list-header">
                <div>الاسم</div>
                <div>رقم الواتساب</div>
            </div>
            <!-- هذه بيانات توضيحية لشكل اللوحة -->
            <div class="list-item">
                <div class="item-name">سارة محمد</div>
                <div class="item-phone">+90 555 123 4567</div>
            </div>
            <div class="list-item">
                <div class="item-name">نورة عبدالله</div>
                <div class="item-phone">+90 555 987 6543</div>
            </div>
        </div>

        <a href="https://docs.google.com/spreadsheets/d/1Irkeydm0CzHbiRQ4QE_-PuiM4OCYejIbFEL2o0Caju0/edit" target="_blank" class="action-btn">
            فتح ملف Google Sheets للإدارة الكاملة
        </a>
    </div>

</body>
</html>
