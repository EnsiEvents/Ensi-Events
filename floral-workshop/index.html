<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل - ورشة ورد الخريف | ENSI & Rosaria</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           المتغيرات (Variables)
           ========================================= */
        :root {
            --gold: #FBF3B5;
            --dark-olive: #1a241c;
            --copper: #8b4513;
            --burgundy: #4a0e17;
            --glass-bg: rgba(20, 30, 20, 0.45);
            --glass-border: rgba(251, 243, 181, 0.2);
            --ticket-bg: rgba(251, 243, 181, 0.15); /* لون التذكرة */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        
        body, html {
            height: 100%;
            overflow-x: hidden;
            background-color: var(--dark-olive);
            color: var(--gold);
        }

        /* =========================================
           الخلفية المتحركة (Breathing Gradient)
           ========================================= */
        .animated-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(-45deg, #1b271d, #3e271a, #261618, #1a241c);
            background-size: 400% 400%;
            animation: gradientBreathing 20s ease infinite; z-index: 0;
        }

        @keyframes gradientBreathing {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* =========================================
           تأثير التساقط (الأوراق واليقطين)
           ========================================= */
        .falling-elements-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1; overflow: hidden;
        }

        .falling-item { position: absolute; top: -15vh; animation: fallAnimation linear infinite; }

        .leaf-a { left: 10%; width: 45px; animation-duration: 15s; animation-delay: 0s; filter: blur(1px); opacity: 0.6; }
        .leaf-b { left: 80%; width: 55px; animation-duration: 18s; animation-delay: 2s; filter: blur(2px); opacity: 0.4; }
        .leaf-c { left: 30%; width: 40px; animation-duration: 14s; animation-delay: 5s; opacity: 0.7; }
        .leaf-d { left: 90%; width: 50px; animation-duration: 16s; animation-delay: 8s; filter: blur(1px); opacity: 0.5; }
        .leaf-e { left: 50%; width: 35px; animation-duration: 12s; animation-delay: 11s; filter: blur(3px); opacity: 0.3; }
        .leaf-f { left: 15%; width: 50px; animation-duration: 19s; animation-delay: 14s; opacity: 0.6; }
        
        .pump-a { left: 25%; width: 60px; animation-duration: 20s; animation-delay: 1s; opacity: 0.7; }
        .pump-b { left: 75%; width: 50px; animation-duration: 22s; animation-delay: 6s; filter: blur(2px); opacity: 0.5; }
        .pump-c { left: 45%; width: 55px; animation-duration: 18s; animation-delay: 12s; opacity: 0.6; }

        @keyframes fallAnimation {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(120vh) rotate(360deg); }
        }

        /* =========================================
           الهيكل الرئيسي والتصميم الزجاجي للفورم
           ========================================= */
        .page-wrapper {
            position: relative; min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 40px 20px 0; z-index: 10; 
        }

        .glass-form-container {
            position: relative; background: var(--glass-bg); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 20px;
            width: 100%; max-width: 550px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; transform: translateY(30px); z-index: 10; overflow: hidden; 
        }
        
        /* حاوية تتضمن الفورم والتذكرة لتطبيق الأنيميشن بينهما */
        .content-switcher {
            position: relative;
            padding: 40px;
            z-index: 5;
            min-height: 500px; /* للحفاظ على ارتفاع ثابت عند التبديل */
        }

        /* حالة الفورم */
        .form-view {
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            opacity: 1; transform: scale(1) translateY(0);
        }
        
        .form-view.hidden {
            opacity: 0; transform: scale(0.9) translateY(-30px);
            pointer-events: none; position: absolute; top: 40px; left: 40px; right: 40px;
        }

        /* حالة التذكرة (E-Ticket) */
        .ticket-view {
            position: absolute; top: 40px; left: 40px; right: 40px;
            background: var(--ticket-bg);
            border: 2px dashed rgba(251, 243, 181, 0.4); /* حدود متقطعة مثل التذكرة */
            border-radius: 15px; padding: 40px 20px; text-align: center;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            opacity: 0; transform: scale(0.9) translateY(30px); pointer-events: none;
        }
        
        .ticket-view.active {
            opacity: 1; transform: scale(1) translateY(0); pointer-events: all; position: relative; top: 0; left: 0; right: 0;
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           تصميم التذكرة (E-Ticket)
           ========================================= */
        .ticket-icon { font-size: 50px; margin-bottom: 10px; animation: gentleFloat 4s infinite alternate; }
        .ticket-name { font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 10px; letter-spacing: 1px; }
        .ticket-msg { font-size: 16px; line-height: 1.6; color: #e6e6e6; margin-bottom: 20px; }
        .ticket-divider { width: 80%; height: 1px; background: rgba(251, 243, 181, 0.3); margin: 20px auto; }
        .ticket-payment-info { font-size: 14px; color: #dcdcdc; line-height: 1.5; margin-bottom: 30px; }
        
        .new-booking-btn {
            background: transparent; border: 1px solid var(--gold); color: var(--gold);
            padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 8px;
            cursor: pointer; transition: 0.3s;
        }
        .new-booking-btn:hover { background: var(--gold); color: var(--dark-olive); }

        /* =========================================
           الورد الجانبي 
           ========================================= */
        .flower-left-inside {
            position: absolute; top: 20%; left: -80px; width: 350px; z-index: 0; pointer-events: none;
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0.8) 10%, rgba(0,0,0,0) 60%);
            mask-image: linear-gradient(to right, rgba(0,0,0,0.8) 10%, rgba(0,0,0,0) 60%);
            animation: gentleFloat 6s ease-in-out infinite alternate;
        }

        @keyframes gentleFloat { 0% { transform: translateY(0); } 100% { transform: translateY(15px); } }

        /* =========================================
           اللوجو والعنوان والوصف والملاحظات للفورم
           ========================================= */
        .cobranding { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .cobranding img { height: 40px; }
        .separator { width: 1px; height: 30px; background-color: var(--glass-border); }
        .rosaria-text { font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #fff; }

        .workshop-title-img { width: 100%; max-width: 400px; display: block; margin: 0 auto 15px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3)); }
        .workshop-description { text-align: center; font-size: 15px; line-height: 1.6; color: #dcdcdc; margin-bottom: 15px; padding: 0 10px; }

        .registration-note {
            text-align: center; font-size: 13px; color: var(--gold);
            background: rgba(251, 243, 181, 0.05); border: 1px dashed rgba(251, 243, 181, 0.4);
            padding: 10px; border-radius: 8px; margin-bottom: 25px; line-height: 1.5;
        }

        .form-section-title {
            text-align: center; font-size: 20px; font-weight: 700; color: var(--gold);
            margin-bottom: 25px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px;
        }

        /* =========================================
           حقول الإدخال (Inputs)
           ========================================= */
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; letter-spacing: 1px; color: #dcdcdc; }

        .form-control {
            width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border);
            border-radius: 8px; padding: 12px 15px; color: #fff; font-size: 16px; transition: all 0.3s ease; outline: none;
        }
        .form-control:focus { border-color: var(--gold); background: rgba(0, 0, 0, 0.5); box-shadow: 0 0 10px rgba(251, 243, 181, 0.1); }
        .phone-input { text-align: right; direction: ltr; }

        .submit-btn {
            width: 100%; background: var(--gold); color: var(--dark-olive); border: none;
            padding: 15px; font-size: 18px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; margin-top: 10px;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(251, 243, 181, 0.3); }

        /* =========================================
           حقيبة الورد السفلية
           ========================================= */
        .bottom-bag-container {
            width: 100%; display: flex; justify-content: center; margin-top: -10px;
            background: rgba(0,0,0,0.1); border-top: 1px solid var(--glass-border); padding-top: 20px;
        }
        .bottom-bag-img {
            width: 100%; max-width: 400px; height: auto;
            filter: drop-shadow(0 -5px 15px rgba(0,0,0,0.4)); margin-bottom: -10px;
        }

        @media (max-width: 768px) {
            .content-switcher { padding: 30px 20px; min-height: 450px; }
            .rosaria-text { font-size: 20px; }
            .flower-left-inside { width: 250px; left: -50px; top: 15%; }
            .ticket-name { font-size: 22px; }
        }
    </style>
</head>
