<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل - ورشة ورد الخريف | ENSI & Rosaria</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           المتغيرات (Variables)
           ========================================= */
        :root {
            --gold: #FBF3B5;
            --dark-olive: #1a241c;
            --copper: #8b4513;
            --burgundy: #4a0e17;
            --glass-bg: rgba(20, 30, 20, 0.45);
            --glass-border: rgba(251, 243, 181, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        
        body, html {
            min-height: 100vh;
            overflow-x: hidden;
            background-color: var(--dark-olive);
            color: var(--gold);
        }

        /* =========================================
           الخلفية المتحركة 
           ========================================= */
        .animated-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(-45deg, #1b271d, #3e271a, #261618, #1a241c);
            background-size: 400% 400%;
            animation: gradientBreathing 20s ease infinite; z-index: 0;
        }

        @keyframes gradientBreathing {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* =========================================
           تأثير التساقط 
           ========================================= */
        .falling-elements-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1; overflow: hidden;
        }

        .falling-item { position: absolute; top: -15vh; animation: fallAnimation linear infinite; }

        .leaf-a { left: 10%; width: 45px; animation-duration: 15s; animation-delay: 0s; filter: blur(1px); opacity: 0.6; }
        .leaf-b { left: 80%; width: 55px; animation-duration: 18s; animation-delay: 2s; filter: blur(2px); opacity: 0.4; }
        .leaf-c { left: 30%; width: 40px; animation-duration: 14s; animation-delay: 5s; opacity: 0.7; }
        .leaf-d { left: 90%; width: 50px; animation-duration: 16s; animation-delay: 8s; filter: blur(1px); opacity: 0.5; }
        .leaf-e { left: 50%; width: 35px; animation-duration: 12s; animation-delay: 11s; filter: blur(3px); opacity: 0.3; }
        .leaf-f { left: 15%; width: 50px; animation-duration: 19s; animation-delay: 14s; opacity: 0.6; }
        
        .pump-a { left: 25%; width: 60px; animation-duration: 20s; animation-delay: 1s; opacity: 0.7; }
        .pump-b { left: 75%; width: 50px; animation-duration: 22s; animation-delay: 6s; filter: blur(2px); opacity: 0.5; }
        .pump-c { left: 45%; width: 55px; animation-duration: 18s; animation-delay: 12s; opacity: 0.6; }

        @keyframes fallAnimation {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(120vh) rotate(360deg); }
        }

        /* =========================================
           الهيكل الرئيسي والتصميم الزجاجي
           ========================================= */
        .page-wrapper {
            position: relative; min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 40px 20px 0; z-index: 10; 
        }

        .glass-form-container {
            position: relative; background: var(--glass-bg); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 20px;
            width: 100%; max-width: 550px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; transform: translateY(30px); z-index: 10; 
        }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        /* =========================================
           الورد الجانبي 
           ========================================= */
        .flower-left-inside {
            position: absolute; top: 20%; left: -80px; width: 350px; pointer-events: none; z-index: 0;
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0.8) 10%, rgba(0,0,0,0) 60%);
            mask-image: linear-gradient(to right, rgba(0,0,0,0.8) 10%, rgba(0,0,0,0) 60%);
            animation: gentleFloat 6s ease-in-out infinite alternate;
        }
        @keyframes gentleFloat { 0% { transform: translateY(0); } 100% { transform: translateY(15px); } }

        /* =========================================
           حركة 3D FLIP الساحرة
           ========================================= */
        .flip-container {
            perspective: 1500px; /* لعمق ثلاثي الأبعاد أفضل */
            -webkit-perspective: 1500px;
            width: 100%;
            z-index: 5;
            position: relative;
        }

        .flip-inner {
            width: 100%;
            position: relative;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform 0.9s cubic-bezier(0.68, -0.55, 0.265, 1.55); /* حركة ارتدادية ناعمة */
        }

        .flip-inner.is-flipped {
            transform: rotateY(180deg);
        }

        /* الطبقات الأمامية والخلفية */
        .front-face, .back-face {
            width: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            padding: 40px;
        }

        .front-face {
            position: relative;
            z-index: 2;
            transform: rotateY(0deg); /* الوضع الطبيعي */
        }

        .back-face {
            position: absolute;
            top: 0; left: 0; height: 100%;
            transform: rotateY(180deg); /* مقلوبة مسبقاً لتظهر صحيحة بعد الدوران */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================================
           تصميم التذكرة (E-Ticket Boarding Pass)
           ========================================= */
        .ticket-wrapper {
            background: rgba(251, 243, 181, 0.08);
            border: 1px solid rgba(251, 243, 181, 0.3);
            border-radius: 15px;
            width: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }

        .ticket-header {
            background: rgba(251, 243, 181, 0.15);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(251, 243, 181, 0.2);
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .ticket-body {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px dashed rgba(251, 243, 181, 0.4); /* خط القطع */
            position: relative;
        }

        /* دوائر قص التذكرة الوهمية (اختياري، تعطي شكل تذكرة مقصوصة) */
        .ticket-body::before, .ticket-body::after {
            content: ''; position: absolute; bottom: -12px; width: 24px; height: 24px;
            background: var(--dark-olive); border-radius: 50%; box-shadow: inset 0 3px 5px rgba(0,0,0,0.5);
        }
        .ticket-body::before { right: -12px; }
        .ticket-body::after { left: -12px; }

        .ticket-name { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 15px; line-height: 1.5;}
        .ticket-msg { font-size: 15px; line-height: 1.6; color: #e6e6e6; }
        
        .ticket-footer {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            border-radius: 0 0 15px 15px;
        }

        /* الباركود الأنيق */
        .barcode {
            height: 35px; width: 85%; margin: 0 auto 20px;
            background-image: repeating-linear-gradient(to right, 
                var(--gold) 0, var(--gold) 3px, transparent 3px, transparent 5px, 
                var(--gold) 5px, var(--gold) 6px, transparent 6px, transparent 10px, 
                var(--gold) 10px, var(--gold) 14px, transparent 14px, transparent 16px
            );
            opacity: 0.6;
        }

        .new-booking-btn {
            background: transparent; border: 1px solid var(--gold); color: var(--gold);
            padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 8px;
            cursor: pointer; transition: 0.3s;
        }
        .new-booking-btn:hover { background: var(--gold); color: var(--dark-olive); }

        /* =========================================
           الفورم الداخلي
           ========================================= */
        .cobranding { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .cobranding img { height: 40px; }
        .separator { width: 1px; height: 30px; background-color: var(--glass-border); }
        .rosaria-text { font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #fff; }

        .workshop-title-img { width: 100%; max-width: 400px; display: block; margin: 0 auto 15px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3)); }
        .workshop-description { text-align: center;
