<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل - ورشة ورد الخريف | ENSI & Rosaria</title>
    
    <!-- استدعاء خط فاخر من جوجل (Tajawal) كبديل أنيق ومضمون للويب -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           المتغيرات (Variables)
           ========================================= */
        :root {
            --gold: #FBF3B5;
            --dark-olive: #1a241c;
            --copper: #8b4513;
            --burgundy: #4a0e17;
            --glass-bg: rgba(20, 30, 20, 0.45);
            --glass-border: rgba(251, 243, 181, 0.2);
        }

        /* =========================================
           إعادة الضبط الأساسية
           ========================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        
        body, html {
            height: 100%;
            overflow-x: hidden;
            background-color: var(--dark-olive);
            color: var(--gold);
        }

        /* =========================================
           الخلفية المتحركة (Breathing Gradient)
           ========================================= */
        .animated-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(-45deg, #1b271d, #3e271a, #261618, #1a241c);
            background-size: 400% 400%;
            animation: gradientBreathing 20s ease infinite;
            z-index: -2;
        }

        @keyframes gradientBreathing {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* =========================================
           العناصر الزخرفية (الورود، الأوراق، اليقطين)
           ========================================= */
        .decoration {
            position: absolute;
            pointer-events: none; /* لمنع إعاقة النقر على الفورم */
        }

        /* الورد الجانبي الأيسر مع تأثير التلاشي (Mask) */
        .flower-left {
            top: 10%;
            left: -5%;
            width: 450px;
            max-width: 50vw;
            z-index: 1;
            /* سر السحر: تلاشي شفافية الصورة نحو اليمين */
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to right, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            animation: gentleFloat 6s ease-in-out infinite alternate;
        }

        /* أوراق متساقطة في الخلفية */
        .leaf-1 { top: 15%; right: 10%; width: 80px; filter: blur(2px); animation: floatRotate 8s linear infinite; opacity: 0.6; }
        .leaf-2 { top: 60%; left: 15%; width: 60px; filter: blur(1px); animation: floatRotate 10s linear infinite reverse; opacity: 0.5; }
        .mini-pumpkin-float { top: 40%; right: 5%; width: 90px; filter: blur(3px); animation: gentleFloat 7s ease-in-out infinite alternate; opacity: 0.4; z-index: -1; }

        @keyframes gentleFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(20px); }
        }

        @keyframes floatRotate {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(30px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        /* =========================================
           الهيكل الرئيسي والتصميم الزجاجي للفورم
           ========================================= */
        .page-wrapper {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            z-index: 2;
        }

        .glass-form-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            /* حركة الدخول المتدرج */
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
            z-index: 10;
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        /* اللوجو المشترك */
        .cobranding {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .cobranding img { height: 40px; }
        .separator { width: 1px; height: 30px; background-color: var(--glass-border); }
        .rosaria-text { font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #fff; }

        /* عنوان الورشة (صورة) */
        .workshop-title-img {
            width: 100%;
            max-width: 400px;
            display: block;
            margin: 0 auto 30px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        /* =========================================
           حقول الإدخال (Inputs)
           ========================================= */
        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            color: #dcdcdc;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 12px 15px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-control:focus {
            border-color: var(--gold);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 10px rgba(251, 243, 181, 0.1);
        }

        /* حقل الهاتف المزدوج (مفتاح الدولة + الرقم) */
        .phone-group { display: flex; gap: 10px; }
        .phone-code { width: 100px; flex-shrink: 0; }
        
        select.form-control option { background-color: var(--dark-olive); color: #fff; }

        /* زر التسجيل */
        .submit-btn {
            width: 100%;
            background: var(--gold);
            color: var(--dark-olive);
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(251, 243, 181, 0.3);
        }

        /* =========================================
           حقيبة الورد السفلية (Anchor)
           ========================================= */
        .bottom-bag-container {
            margin-top: -30px; /* لدمجها برفق مع أسفل الفورم */
            width: 100%;
            max-width: 450px;
            z-index: 15;
            position: relative;
            animation: slideUpFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            pointer-events: none; /* حتى لا تمنع النقر لو غطت على شيء */
        }
        .bottom-bag-img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
        }

        /* =========================================
           نافذة التأكيد المنبثقة (Modal)
           ========================================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
            opacity: 0; visibility: hidden;
            transition: all 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            max-width: 400px;
            transform: scale(0.8);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        
        .modal-content h3 { font-size: 28px; margin-bottom: 15px; }
        .modal-content p { font-size: 16px; line-height: 1.6; color: #dcdcdc; margin-bottom: 25px; }
        .close-modal-btn {
            background: transparent; border: 1px solid var(--gold); color: var(--gold);
            padding: 10px 25px; border-radius: 5px; font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }
        .close-modal-btn:hover { background: var(--gold); color: var(--dark-olive); }

        /* =========================================
           استجابة الهواتف المحمولة
           ========================================= */
        @media (max-width: 768px) {
            .flower-left { width: 250px; top: 5%; opacity: 0.8; }
            .glass-form-container { padding: 30px 20px; }
            .rosaria-text { font-size: 20px; }
        }
    </style>
</head>
<body>

    <!-- الخلفية المتحركة -->
    <div class="animated-bg"></div>

    <!-- العناصر الزخرفية العائمة -->
    <img src="https://github.com/EnsiEvents/Ensi-Events/blob/main/floral-workshop/IMG_3966.png?raw=true" class="decoration flower-left" alt="Autumn Flowers">
    <img src="https://github.com/EnsiEvents/Ensi-Events/blob/main/floral-workshop/IMG_3967.png?raw=true" class="decoration leaf-1" alt="Leaf">
    <img src="https://github.com/EnsiEvents/Ensi-Events/blob/main/floral-workshop/IMG_3967.png?raw=true" class="decoration leaf-2" alt="Leaf">
    <img src="https://github.com/EnsiEvents/Ensi-Events/blob/main/floral-workshop/IMG_3968.png?raw=true" class="decoration mini-pumpkin-float" alt="Pumpkin">

    <!-- حاوية الصفحة -->
    <div class="page-wrapper">
        
        <!-- صندوق الفورم الزجاجي -->
        <div class="glass-form-container">
            
            <!-- اللوجو المشترك -->
            <div class="cobranding">
                <img src="https://raw.githubusercontent.com/EnsiEvents/Ensi-Events/4819495e2ec21a6a5eae64ffcf60d1d8bb67049c/ENSI%20Logo.svg" alt="ENSI Events">
                <div class="separator"></div>
                <div class="rosaria-text">ROSARIA</div>
            </div>

            <!-- عنوان الورشة (صورة) -->
            <img src="https://github.com/EnsiEvents/Ensi-Events/blob/main/floral-workshop/Title.png?raw=true" class="workshop-title-img" alt="ورشة ورد الخريف">

            <!-- نموذج التسجيل -->
            <form id="workshopForm">
                <div class="form-group">
                    <label>الاسم الأول</label>
                    <input type="text" class="form-control" required placeholder="أدخل اسمك الأول">
                </div>

                <div class="form-group">
                    <label>الاسم الأخير</label>
                    <input type="text" class="form-control" required placeholder="أدخل اسم العائلة">
                </div>

                <div class="form-group">
                    <label>رقم الواتساب (للتواصل وإرسال التفاصيل)</label>
                    <div class="phone-group">
                        <select class="form-control phone-code">
                            <option value="+90">+90 (TR)</option>
                            <option value="+964">+964 (IQ)</option>
                            <option value="+966">+966 (SA)</option>
                            <option value="+971">+971 (AE)</option>
                            <option value="other">أخرى</option>
                        </select>
                        <input type="tel" class="form-control" required placeholder="5XX XXX XX XX" dir="ltr">
                    </div>
                </div>

                <button type="submit" class="submit-btn">احجزي مقعدك الآن</button>
            </form>
        </div>

        <!-- العنصر السفلي (الحقيبة) -->
        <div class="bottom-bag-container">
            <img src="https://github.com/EnsiEvents/Ensi-Events/blob/main/floral-workshop/IMG_3965.png?raw=true" class="bottom-bag-img" alt="حقيبة ورد الخريف">
        </div>

    </div>

    <!-- نافذة نجاح التسجيل (Modal) -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <h3>شكراً لتسجيلك! 🍂</h3>
            <p>تم استلام طلبك بنجاح. سيقوم فريقنا بالتواصل معك قريباً عبر الواتساب لتأكيد الحجز وتزويدك بكافة تفاصيل الورشة.</p>
            <button class="close-modal-btn" id="closeModal">حسناً</button>
        </div>
    </div>

    <!-- الجافاسكريبت لمعالجة الفورم -->
    <script>
        const form = document.getElementById('workshopForm');
        const modal = document.getElementById('successModal');
        const closeModalBtn = document.getElementById('closeModal');

        // منع إعادة تحميل الصفحة وإظهار النافذة
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // يمنع التوجيه للموقع الرئيسي
            
            // هنا يمكنك لاحقاً ربط كود إرسال البيانات (API)
            
            // إظهار رسالة النجاح
            modal.classList.add('active');
        });

        // إغلاق النافذة المنبثقة
        closeModalBtn.addEventListener('click', function() {
            modal.classList.remove('active');
            form.reset(); // تفريغ الحقول بعد الإغلاق
        });
    </script>

</body>
</html>
